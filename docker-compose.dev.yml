services:
  frontend:
    build:
      context: frontend
      dockerfile: ./Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - "./frontend/src:/app/src"
  backend:
    build:
      context: backend
      dockerfile: ./Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - "./backend:/app"
    environment:
      - RUST_BACKTRACE=1
  nginx:
    build:
      context: nginx
      dockerfile: ./Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
    
