[package]
name = "tuptacz"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3.31"
rand = "0.10.1"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
osm4routing = "0.8.0"
geo-types = "0.7.19"
csv = "1.4.0"
chrono = { version = "0.4.45", features = ["serde"] }
ordered-float = { version = "5.3.0", features = ["serde"] }
num-traits = "0.2.19"
sealed = "0.6.0"
itertools = "0.15.0"
bincode = "=1.3.3"
kiddo = "5.3.2"
ouroboros = "0.18.5"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
