[package]
name = "tuptacz"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3.31"
rand = "0.10.1"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
osm4routing = "0.8.0"
geo-types = "0.7.19"
csv = "1.4.0"
chrono = { version = "0.4.45", features = ["serde"] }
